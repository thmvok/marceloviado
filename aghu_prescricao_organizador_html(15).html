<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador de Prescrição AGHU</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px;
      color: #222;
      font-size: 10px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 16px;
    }

    p {
      margin-top: 0;
      color: #555;
      font-size: 10px;
    }

    textarea {
      width: 100%;
      height: 320px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 10px;
      resize: vertical;
      box-sizing: border-box;
      background: white;
    }

    .buttons {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 10px;
      background: #1f6feb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    #resultado {
      margin-top: 18px;
      background: white;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      white-space: pre-wrap;
      font-size: 10px;
      line-height: 1.3;
    }

    .section {
      margin-bottom: 8px;
    }

    .section h2 {
      margin: 0 0 3px 0;
      padding-bottom: 2px;
      border-bottom: 1px solid #ddd;
      font-size: 10px;
      font-weight: bold;
    }

    .atb h2 {
      color: #b00020;
    }

    ul {
      margin: 0;
      padding-left: 16px;
    }

    li {
      margin-bottom: 1px;
      line-height: 1.2;
      font-size: 10px;
    }

    .checkbox-item::before {
      content: "☐ ";
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Organizador de Prescrição AGHU</h1>
  <p>Cole abaixo a prescrição copiada do AGHU e clique em “Organizar Prescrição”.</p>

  <textarea id="input" placeholder="Cole aqui o conteúdo bruto do AGHU..."></textarea>

  <div class="buttons">
    <button onclick="organizarPrescricao()">Organizar Prescrição</button>
    <button onclick="copiarResultado()">Copiar Resultado</button>
  </div>

  <div id="resultado"></div>

  <script>
    const antibioticos = [
      'ceftriaxona', 'cefepime', 'piperacilina', 'tazobactam', 'vancomicina',
      'meropenem', 'ertapenem', 'ciprofloxacino', 'levofloxacino',
      'ampicilina', 'sulbactam', 'clindamicina', 'azitromicina',
      'polimixina', 'daptomicina', 'linezolida', 'oxacilina',
      'cefazolina', 'metronidazol', 'teicoplanina'
    ];

    const imunossupressores = [
      'tacrolimo',
      'micofenolato',
      'everolimus',
      'everolimo',
      'azatioprina'
    ];

    function normalizarTexto(txt) {
      return txt
        .replace(/CMP/gi, '')
        .replace(/CAP/gi, '')
        .replace(/INJ/gi, '')
        .replace(/MEDICAMENTO PROPRIO DO PACIENTE\s*:\s*/gi, '')
        .replace(/Endovenosa INFUSÃO/gi, 'EV')
        .replace(/Endovenosa/gi, 'EV')
        .replace(/Oral/gi, 'VO')
        .replace(/Subcutânea/gi, 'SC')
        .replace(/1 X AO DIA/gi, '1x/dia')
        .replace(/12\/12 HORAS/gi, '12/12h')
        .replace(/8\/8 HORAS/gi, '8/8h')
        .replace(/6\/6 HORAS/gi, '6/6h')
        .replace(/4\/4 HORAS/gi, '4/4h')
        .replace(/A CRITÉRIO MÉDICO/gi, 'ACM')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function extrairMedicamentos(texto) {
      const linhas = texto.split('\n');
      const meds = [];

      for (let linha of linhas) {
        linha = linha.trim();

        if (!linha) continue;

        if (
          linha.includes('Validado') &&
          (
            linha.includes('Fixo') ||
            linha.includes('Se Necessário')
          )
        ) {
          meds.push(linha);
        }
      }

      return meds;
    }

    function extrairDieta(texto) {
      return null;
    }

    function parseMedicamento(linha) {
      linha = normalizarTexto(linha);

      const partes = linha.split('Validado')[0].trim();

      const regex = /(.+?)\s+(\d+\s?(?:mg|mL|UI|UN|AMP|amp|g))\s+(VO|EV|SC|Retal)\s+(.*?)\s+(Fixo|Se Necessário)/i;

      const m = partes.match(regex);

      if (!m) {
        return null;
      }

      return {
        raw: partes,
        nome: m[1].trim(),
        dose: m[2].trim(),
        via: m[3].trim(),
        frequencia: m[4].replace(/;+/g, '').trim(),
        condicao: m[5].trim()
      };
    }

    function ehAntibiotico(nome) {
      return antibioticos.some(atb => nome.toLowerCase().includes(atb));
    }

    function ehImunossupressor(nome) {
      return imunossupressores.some(im => nome.toLowerCase().includes(im));
    }

    function ehProfilaxia(med) {
      const nome = med.nome.toLowerCase();

      if (nome.includes('aas')) return true;
      if (nome.includes('acido acetilsalicilico')) return true;
      if (nome.includes('prednisona')) return true;
      if (nome.includes('aciclovir')) return true;
      if (nome.includes('ganciclovir')) return true;

      if (
        (nome.includes('sulfametoxazol') || nome.includes('trimetoprima')) &&
        med.frequencia.includes('1x/dia')
      ) {
        return true;
      }

      return false;
    }

    function agruparImunossupressores(lista) {
      const agrupados = {};

      lista.forEach(med => {
        const chaveBase = med.nome
          .toLowerCase()
          .replace(/\d+/g, '')
          .trim();

        if (!agrupados[chaveBase]) {
          agrupados[chaveBase] = {
            nome: med.nome.split(' ')[0],
            doseTotal: 0,
            unidade: med.dose.match(/[a-zA-Z]+/)[0],
            via: med.via,
            frequencia: med.frequencia
          };
        }

        const doseNum = parseFloat(med.dose.match(/[\d\.]+/)[0]);
        agrupados[chaveBase].doseTotal += doseNum;
      });

      return Object.values(agrupados).map(g => {
        return `${g.nome} ${g.doseTotal} ${g.unidade} ${g.via} ${g.frequencia}`;
      });
    }

    function organizarPrescricao() {
      const texto = document.getElementById('input').value;
      const resultado = document.getElementById('resultado');

      const dieta = extrairDieta(texto);
      const medsBrutos = extrairMedicamentos(texto);
      const meds = medsBrutos.map(parseMedicamento).filter(Boolean);

      const secoes = {
        atb: [],
        imuno: [],
        profilaxia: [],
        meds: [],
        sn: []
      };

      meds.forEach(med => {
        if (med.condicao.toLowerCase().includes('necessário')) {
          secoes.sn.push(med);
          return;
        }

        if (ehAntibiotico(med.nome)) {
          secoes.atb.push(med);
          return;
        }

        if (ehImunossupressor(med.nome)) {
          secoes.imuno.push(med);
          return;
        }

        if (ehProfilaxia(med)) {
          secoes.profilaxia.push(med);
          return;
        }

        secoes.meds.push(med);
      });

      let html = '';

      

      if (secoes.atb.length) {
        html += `<div class="section atb"><h2>ATB</h2><ul>`;

        secoes.atb.forEach(m => {
          html += `<li>${m.nome} ${m.dose} ${m.via} ${m.frequencia}</li>`;
        });

        html += `</ul></div>`;
      }

      if (secoes.imuno.length) {
        html += `<div class="section"><h2>IMUNOSSUPRESSORES</h2><ul>`;

        agruparImunossupressores(secoes.imuno).forEach(item => {
          html += `<li>${item}</li>`;
        });

        html += `</ul></div>`;
      }

      if (secoes.profilaxia.length) {
        html += `<div class="section"><h2>PROFILAXIAS</h2><ul>`;

        secoes.profilaxia.forEach(m => {
          html += `<li>${m.nome} ${m.dose} ${m.via} ${m.frequencia}</li>`;
        });

        html += `</ul></div>`;
      }

      if (secoes.meds.length) {
        html += `<div class="section"><h2>MEDICAÇÕES</h2><ul>`;

        secoes.meds.forEach(m => {
          html += `<li>${m.nome} ${m.dose} ${m.via} ${m.frequencia}</li>`;
        });

        html += `</ul></div>`;
      }

      if (secoes.sn.length) {
        html += `<div class="section"><h2>SE NECESSÁRIO ☐</h2><ul>`;

        secoes.sn.forEach(m => {
          html += `<li class="checkbox-item">${m.nome} ${m.dose} ${m.via} ${m.frequencia}</li>`;
        });

        html += `</ul></div>`;
      }

      resultado.innerHTML = html;
    }

    function copiarResultado() {
      const resultado = document.getElementById('resultado');

      const linhas = [];

      resultado.querySelectorAll('.section').forEach(secao => {
        const titulo = secao.querySelector('h2');

        if (titulo) {
          linhas.push(titulo.innerText.trim());
        }

        secao.querySelectorAll('li').forEach(li => {
          linhas.push('- ' + li.innerText.trim());
        });

        linhas.push('');
      });

      const texto = linhas.join('\n').trim();

      navigator.clipboard.writeText(texto)
        .then(() => {
          alert('Resultado copiado!');
        })
        .catch(() => {
          alert('Erro ao copiar.');
        });
    }
  </script>
</body>
</html>
